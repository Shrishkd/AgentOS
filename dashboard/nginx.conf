server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8000;
    set $monitor http://nats:8222;

    location = /health/jetstream {
        proxy_pass $monitor/healthz?js-enabled-only=true;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    location ~ ^/(health/(ready|live)|openapi\.json|docs)$ {
        proxy_pass $api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
    }
    location /v1/ {
        client_max_body_size 1m;
        proxy_pass $api;
    }
    location = /metrics {
        return 404;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
