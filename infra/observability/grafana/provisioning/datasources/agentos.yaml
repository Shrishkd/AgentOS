apiVersion: 1
datasources:
  - name: AgentOS metrics
    uid: agentos-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
  - name: AgentOS traces
    uid: agentos-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
