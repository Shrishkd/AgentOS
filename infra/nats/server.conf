port: 4222
http_port: 8222
jetstream { store_dir: "/data" }
authorization {
  users: [
    { user: agentos_publisher, password: $PUBLISHER_PASSWORD,
      permissions: { publish: ["agentos.wakeup", "$JS.API.STREAM.CREATE.AGENTOS",
                               "$JS.API.CONSUMER.DURABLE.CREATE.AGENTOS.WORKERS"],
                     subscribe: ["_INBOX.agentos_publisher.>"] } },
    { user: agentos_worker, password: $WORKER_PASSWORD,
      permissions: { publish: ["$JS.API.CONSUMER.MSG.NEXT.AGENTOS.WORKERS", "$JS.ACK.AGENTOS.WORKERS.>"],
                     subscribe: ["_INBOX.agentos_worker.>"] } }
  ]
}
