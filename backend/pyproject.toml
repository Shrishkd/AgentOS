[project]
name = "agentos-control-plane"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "nats-py>=2.10,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10.1,<3",
    "redis>=5.2,<7",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8,<10",
    "testcontainers>=4.8,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
