x-postgres-image: &postgres-image postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73

x-app: &app
  init: true
  image: ${AGENTOS_BACKEND_IMAGE:?set a release image}
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  pids_limit: 128

services:
  credentials:
    volumes: !override [archive:/archive, backups:/backups]
    command: ["/bin/sh", "-ec", "chown postgres:postgres /archive /backups && chmod 0700 /archive /backups"]
    image: *postgres-image
    entrypoint: []
  postgres:
    image: *postgres-image
    networks: [state]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d agentos -Atc 'SELECT NOT pg_is_in_recovery()' | grep -qx t"]
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_timeout=60s", "-c", "archive_command=sh /archive-wal.sh %p %f"]
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/admin:/secrets/admin:ro
      - ${AGENTOS_SECRET_DIR:?}/api:/secrets/api:ro
      - ./infra/postgres/archive-wal.sh:/archive-wal.sh:ro
      - archive:/archive
      - pg-socket:/var/run/postgresql
  runtime-logins:
    image: *postgres-image
    networks: [state]
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/admin:/secrets/admin:ro
      - ${AGENTOS_SECRET_DIR:?}/worker:/secrets/worker:ro
      - ${AGENTOS_SECRET_DIR:?}/publisher:/secrets/publisher:ro
  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    networks: [state]
    restart: unless-stopped
  nats:
    image: nats:2.11-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
    networks: [state]
    restart: unless-stopped
    volumes: !override
      - js-data:/data
      - ${AGENTOS_SECRET_DIR:?}/worker/broker:/secrets/worker:ro
      - ${AGENTOS_SECRET_DIR:?}/publisher/broker:/secrets/publisher:ro
      - ./infra/nats/server.conf:/etc/nats/agentos.conf:ro
  migrate:
    <<: *app
    networks: [state]
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/admin:/secrets/admin:ro
  api:
    <<: *app
    networks: [state]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      AGENTOS_TOKEN_ISSUER: ${AGENTOS_TOKEN_ISSUER:?set the trusted issuer}
      AGENTOS_TOKEN_AUDIENCE: ${AGENTOS_TOKEN_AUDIENCE:?set the audience}
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/api:/secrets/api:ro
      - ${AGENTOS_SECRET_DIR:?}/identity:/keys/public:ro
  publisher:
    <<: *app
    networks: [state]
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/publisher:/secrets/runtime:ro
    healthcheck:
      test: ["CMD", "python", "-m", "agentos.publisher", "health"]
      interval: 10s
      timeout: 4s
      retries: 3
  worker:
    <<: *app
    networks: [state, egress]
    environment:
      AGENTOS_MODEL_API_KEY_FILE: ${AGENTOS_MODEL_API_KEY_FILE:-}
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/worker:/secrets/runtime:ro
  operator:
    networks: [state]
    image: ${AGENTOS_BACKEND_IMAGE:?}
    volumes: !override
      - ${AGENTOS_SECRET_DIR:?}/admin:/secrets/admin:ro
  dashboard:
    networks: [state, edge]
    image: ${AGENTOS_DASHBOARD_IMAGE:?set a release image}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    ports: !override
      - "${AGENTOS_BIND_ADDRESS:-127.0.0.1}:${AGENTOS_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./infra/deployment/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AGENTOS_SECRET_DIR:?}/tls:/run/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/"]
  prometheus:
    networks: [state]
    image: prom/prometheus:v3.5.1@sha256:38c3b05c3bc744ff1b0b7b4eb82196026442845e62a1e2073795565da506d7a2
    restart: unless-stopped
    volumes:
      - ./infra/observability/production-prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
  alertmanager:
    networks: [state, egress]
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    volumes:
      - ${AGENTOS_SECRET_DIR:?}/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
  backup:
    image: *postgres-image
    profiles: [ops]
    user: postgres
    entrypoint: ["/bin/sh", "/physical-backup.sh", "backup"]
    volumes:
      - ./infra/postgres/physical-backup.sh:/physical-backup.sh:ro
      - pg-socket:/var/run/postgresql
      - backups:/backups
  restore:
    image: *postgres-image
    profiles: [ops]
    user: postgres
    entrypoint: ["/bin/sh", "/physical-backup.sh", "restore"]
    volumes:
      - ./infra/postgres/physical-backup.sh:/physical-backup.sh:ro
      - pg-data:/var/lib/postgresql/data
      - backups:/backups:ro

volumes:
  pg-socket:
  archive:
    external: true
    name: ${AGENTOS_WAL_VOLUME:?set the WAL archive volume}
  backups:
    external: true
    name: ${AGENTOS_BACKUP_VOLUME:?set the backup volume}
  prometheus-data:
  alertmanager-data:

networks:
  state:
    internal: true
  edge:
  egress:
