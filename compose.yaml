x-probe: &probe
  interval: 5s
  timeout: 4s
  retries: 12
  start_period: 5s

x-backend: &backend
  build: ./backend

x-db: &db
  AGENTOS_DB_HOST: postgres
  AGENTOS_DB_NAME: agentos

services:
  credentials:
    image: alpine:3.22
    volumes:
      - admin-secret:/admin
      - api-secret:/api
      - worker-secret:/worker
      - publisher-secret:/publisher
      - broker-secret:/broker
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        for dir in /admin /api /worker /publisher; do
          if [ ! -s "$$dir/password" ]; then
            head -c 36 /dev/urandom | base64 > "$$dir/new-password"
            chmod 0444 "$$dir/new-password"
            mv "$$dir/new-password" "$$dir/password"
          fi
        done
        for dir in /worker /publisher; do
          if [ ! -s "$$dir/broker" ]; then
            head -c 36 /dev/urandom | base64 > "$$dir/new-broker"
            chmod 0444 "$$dir/new-broker"
            mv "$$dir/new-broker" "$$dir/broker"
          fi
          cp "$$dir/broker" "/broker$$dir"
          chmod 0444 "/broker$$dir"
        done

  postgres:
    image: postgres:17-alpine
    depends_on:
      credentials: {condition: service_completed_successfully}
    environment:
      POSTGRES_DB: agentos
      POSTGRES_PASSWORD_FILE: /secrets/admin/password
    volumes:
      - pg-data:/var/lib/postgresql/data
      - admin-secret:/secrets/admin:ro
      - api-secret:/secrets/api:ro
      - ./infra/postgres/01-api-role.sh:/docker-entrypoint-initdb.d/01-api-role.sh:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "agentos"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      <<: *probe
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]

  nats:
    image: nats:2.11-alpine
    depends_on:
      credentials: {condition: service_completed_successfully}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # NATS parses environment substitutions as configuration values. Quote the stored base64 strings.
        export WORKER_PASSWORD="\"$$(cat /secrets/worker)\""
        export PUBLISHER_PASSWORD="\"$$(cat /secrets/publisher)\""
        exec nats-server -c /etc/nats/agentos.conf
    volumes:
      - js-data:/data
      - broker-secret:/secrets:ro
      - ./infra/nats/server.conf:/etc/nats/agentos.conf:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]

  runtime-logins:
    image: postgres:17-alpine
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./infra/postgres/runtime-logins.sh:/setup.sh:ro
      - admin-secret:/secrets/admin:ro
      - worker-secret:/secrets/worker:ro
      - publisher-secret:/secrets/publisher:ro

  migrate:
    <<: *backend
    depends_on:
      runtime-logins: {condition: service_completed_successfully}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db
      AGENTOS_DB_USER: postgres
      AGENTOS_DB_PASSWORD_FILE: /secrets/admin/password
    volumes:
      - admin-secret:/secrets/admin:ro

  api:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      <<: *db
      AGENTOS_DB_USER: agentos_api
      AGENTOS_API_PROCESSES: ${AGENTOS_API_PROCESSES:-3}
      AGENTOS_DB_PASSWORD_FILE: /secrets/api/password
      AGENTOS_REDIS_URL: redis://redis:6379/0
      AGENTOS_TOKEN_ISSUER: ${AGENTOS_TOKEN_ISSUER:-urn:agentos:local}
      AGENTOS_TOKEN_AUDIENCE: ${AGENTOS_TOKEN_AUDIENCE:-agentos-api}
      AGENTOS_LOG_LEVEL: ${AGENTOS_LOG_LEVEL:-INFO}
      AGENTOS_HEALTH_TIMEOUT_SECONDS: ${AGENTOS_HEALTH_TIMEOUT_SECONDS:-2}
    volumes:
      - api-secret:/secrets/api:ro
      - issuer-public:/keys/public:ro
    healthcheck:
      <<: *probe
      timeout: 14s
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=12).close()"]

  publisher:
    <<: *backend
    command: ["python", "-m", "agentos.publisher"]
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    environment:
      <<: *db
      AGENTOS_DB_USER: agentos_publisher
      AGENTOS_DB_PASSWORD_FILE: /secrets/runtime/password
    volumes:
      - publisher-secret:/secrets/runtime:ro

  worker:
    <<: *backend
    command: ["python", "-m", "agentos.worker"]
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
    environment:
      <<: *db
      AGENTOS_DB_USER: agentos_worker
      AGENTOS_DB_PASSWORD_FILE: /secrets/runtime/password
      AGENTOS_WORKER_CAPACITY: ${AGENTOS_WORKER_CAPACITY:-2}
      AGENTOS_LEASE_SECONDS: ${AGENTOS_LEASE_SECONDS:-15}
      AGENTOS_MODEL_BASE_URL: ${AGENTOS_MODEL_BASE_URL:-}
      AGENTOS_REMOTE_MODEL: ${AGENTOS_REMOTE_MODEL:-}
      AGENTOS_MODEL_TIMEOUT_SECONDS: ${AGENTOS_MODEL_TIMEOUT_SECONDS:-20}
      AGENTOS_MODEL_OUTPUT_CAP: ${AGENTOS_MODEL_OUTPUT_CAP:-512}
      AGENTOS_MODEL_INPUT_USD_PER_MILLION: ${AGENTOS_MODEL_INPUT_USD_PER_MILLION:-}
      AGENTOS_MODEL_OUTPUT_USD_PER_MILLION: ${AGENTOS_MODEL_OUTPUT_USD_PER_MILLION:-}
    volumes:
      - worker-secret:/secrets/runtime:ro
    healthcheck:
      <<: *probe
      test: ["CMD", "python", "-m", "agentos.worker", "health"]

  operator:
    <<: *backend
    profiles: ["tools"]
    user: "0:0"
    entrypoint: ["python", "-m", "agentos.operator"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *db
      AGENTOS_DB_USER: postgres
      AGENTOS_DB_PASSWORD_FILE: /secrets/admin/password
    volumes:
      - admin-secret:/secrets/admin:ro
      - issuer-public:/keys/public
      - issuer-private:/keys/private

  dashboard:
    build: ./dashboard
    ports:
      - "127.0.0.1:${AGENTOS_PORT:-8080}:8080"
    healthcheck:
      <<: *probe
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]

volumes:
  pg-data:
  js-data:
  admin-secret:
  api-secret:
  worker-secret:
  publisher-secret:
  broker-secret:
  issuer-public:
  issuer-private:
